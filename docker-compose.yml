services:
  # ---------------------------------------------------------------------------
  # Core data stores
  # ---------------------------------------------------------------------------
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: netpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: netpulse
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: netpulse
    # Bound to localhost only – app traffic stays on the host loopback.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netpulse -d netpulse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: netpulse-redis
    restart: unless-stopped
    # Bound to localhost only.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    container_name: netpulse-app
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      # Run as root in container to allow raw sockets and packet capture capabilities
    user: "0"
    environment:
      DATABASE_URL: postgresql+asyncpg://netpulse:netpulse@127.0.0.1:5432/netpulse
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ${SECRET_KEY:-super-secret-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@netpulse.local}
      # Leave empty for a clean first-run setup screen. Set a value only for
      # scripted installs; it pre-creates the admin, who must change it on first sign-in.
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      PULSE_GATEWAY_IP: ${PULSE_GATEWAY_IP:-auto}
      PULSE_ISP_IP: ${PULSE_ISP_IP:-8.8.8.8}
      PULSE_CLOUDFLARE_IP: ${PULSE_CLOUDFLARE_IP:-1.1.1.1}
      SCRIPTS_BASE_DIR: /app/scripts
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["http://localhost:8000"]}

      # Celery beat (embedded in netpulse-worker) owns every scheduled job in
      # this stack. The app also runs in-process loops for installs without
      # Celery; leaving both on duplicated each metric sample and alert email.
      ENABLE_LATENCY_MONITOR: ${ENABLE_LATENCY_MONITOR:-false}
      ENABLE_SCHEDULED_TASKS: ${ENABLE_SCHEDULED_TASKS:-false}
    volumes:
      - app_data:/app/data
    cap_add:
      - NET_RAW
      - NET_ADMIN

  # Celery worker with the beat scheduler embedded (-B) so a separate
  # beat container is no longer needed.
  celery_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    container_name: netpulse-worker
    restart: unless-stopped
    network_mode: host
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --concurrency=4 caps parallelism; --max-tasks-per-child=100 recycles workers to prevent memory leaks.
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=4", "--max-tasks-per-child=100", "--beat"]
    user: "0"
    environment:
      DATABASE_URL: postgresql+asyncpg://netpulse:netpulse@127.0.0.1:5432/netpulse
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ${SECRET_KEY:-super-secret-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SCRIPTS_BASE_DIR: /app/scripts
    volumes:
      - app_data:/app/data
    cap_add:
      - NET_RAW
      - NET_ADMIN

volumes:
  db_data:
  app_data:
