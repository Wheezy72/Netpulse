name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: all tokens start read-only.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint Python with ruff
  # ---------------------------------------------------------------------------
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check app/

      - name: Install vulture
        run: pip install vulture

      - name: Run vulture (dead-code detection)
        run: vulture app/ vulture_whitelist.py --min-confidence 80

  # ---------------------------------------------------------------------------
  # Python unit tests (no DB / Redis required)
  # ---------------------------------------------------------------------------
  test-python:
    name: Unit Tests (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime + test dependencies
        run: |
          # setuptools/wheel are needed because requirements include sdist-only
          # packages (python-nmap) that build from source.
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          # pymupdf is test-only: the PDF report tests assert on the actual
          # bytes a report produces, so they need a PDF reader. It is kept out
          # of requirements.txt because the app never parses a PDF itself.
          pip install pytest pytest-asyncio aiosqlite "pymupdf>=1.25"

      - name: Run tests
        run: pytest tests/ -v

  # ---------------------------------------------------------------------------
  # Docker build smoke test — proves all Dockerfiles build cleanly.
  # Catches apt/package failures and broken URLs before they reach a real machine.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy env defaults
        run: cp .env.example .env

      - name: Build all images (no cache)
        run: docker compose build --no-cache
